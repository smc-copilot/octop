id: business-ui
version: 0.1.0
name: Business UI
description: >-
  聊天内嵌已发布业务表单。连接用全局 BUSINESS_UI_* 配置。
  填写位置：Dashboard「高级设置 → 环境变量」，或 ~/.octop/env，或进程环境。
  密钥禁止写入变量值（会进 shell/MCP），只用绝对路径 *_FILE（chmod 0600）。
  每位用户仍须单独激活。Dashboard 保存环境变量立刻生效、不必重启；只改磁盘 env 或 systemd/Docker -e 须重启。
  环境页无 Test 按钮，在插件目录执行 python -m business_ui test。未设 BUSINESS_UI_BASE_URL 则不做环境引导。
  已设 BASE_URL 后必填：BUSINESS_UI_BASE_URL（HTTPS Adapter 基址）；
  BUSINESS_UI_INSTANCE_ISSUER（本 Octop https 源，每实例唯一）；
  BUSINESS_UI_OPERATOR_USER_ID（持有服务凭据的本地 admin 数字 user_id，不是用户名）；
  BUSINESS_UI_SERVICE_SECRET_FILE（服务 Bearer 绝对路径，缺则失败关闭、不会跳过鉴权）。
  有默认：BUSINESS_UI_CONNECTION_ID（默认 default）；BUSINESS_UI_DISPLAY_NAME（默认等于 CONNECTION_ID）；
  BUSINESS_UI_AUTH_METHOD（默认 api_token，取值 api_token 或 authorization_code）；
  BUSINESS_UI_USER_AUTH_METHOD（默认 oauth2，取值 oauth2、native_login、personal_access_token）；
  BUSINESS_UI_ENABLED（默认 1，0/false/off 停用）；BUSINESS_UI_OAUTH_SCOPES（默认 openid profile）。
  oauth2 另需 BUSINESS_UI_OAUTH_CLIENT_ID，以及 BUSINESS_UI_OAUTH_DISCOVERY_URL 或同时给出
  BUSINESS_UI_OAUTH_AUTHORIZE_URL 与 BUSINESS_UI_OAUTH_TOKEN_URL；BUSINESS_UI_OAUTH_REVOKE_URL 可选；
  BUSINESS_UI_OAUTH_CLIENT_SECRET_FILE 可选（机密客户端绝对路径）。
  可选：BUSINESS_UI_PRIVATE_ALLOW（内网或回环须显式 CIDR/host，禁止 169.254.0.0/16）；
  BUSINESS_UI_EXTRA_ORIGINS（额外 HTTPS origin）；BUSINESS_UI_TLS_CA_FILE（自签 CA，可为 0644）。
  完整表与可复制模板见插件 docs/env-deploy.md 与 docs/env.template。
icon: "📋"
group: tools
kind: tool
entry: main.py
requires:
  - httpx>=0.27
ui:
  entry: ui/index.js
  manifest: ui/manifest.json
